<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FASCIA">
  <title>FASCIA Myofascial Release V08 2026.08.14 08:55.13</title>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=V08">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="topline">
      <h1 id="app-title">FASCIA Myofascial Release</h1>
      <p>V08 · 2026.08.14 08:55.13 · Created by Kevin</p>
      <time id="current-time" datetime="">----.--.-- --:--</time>
    </header>

    <section class="counters" aria-label="Myofascial release counters">
      <article class="counter counter-primary counter-red">
        <span class="counter-label">30 SEC</span>
        <strong id="counter-30" aria-live="polite">0</strong>
      </article>
      <article class="counter counter-green">
        <span class="counter-label">SEC 00–29</span>
        <strong id="counter-5">00</strong>
      </article>
      <article class="counter counter-blue">
        <span class="counter-label">5 MIN</span>
        <strong id="counter-10">0</strong>
      </article>
    </section>

    <section class="session" aria-label="Session controls">
      <div class="session-status">
        <span id="state-label" class="state-label">READY</span>
        <span id="remaining-time" class="remaining-time">20:00</span>
      </div>

      <div class="cycle-tabs" role="group" aria-label="Select number of ten-minute cycles">
        <button class="cycle-tab" type="button" data-cycles="1" aria-pressed="false">C1 <small>10 MIN</small></button>
        <button class="cycle-tab is-selected" type="button" data-cycles="2" aria-pressed="true">C2 <small>20 MIN</small></button>
        <button class="cycle-tab" type="button" data-cycles="3" aria-pressed="false">C3 <small>30 MIN</small></button>
      </div>

      <button id="start-pause" class="start-button" type="button">START</button>
    </section>
  </main>

  <audio id="cricket-sound" src="assets/cricket.wav" preload="auto"></audio>
  <script src="js/app.js?v=V08"></script>
</body>
</html>
